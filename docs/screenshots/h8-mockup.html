function Code({ t, text, format }) {
  let shown = text;
  if (format === 'JSON') shown = pretty(text) ?? text;
  if (format === 'Hex') shown = hex(text);
  const html = format === 'JSON' && pretty(text)
    ? shown.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))
        .replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(-?\d+(?:\.\d+)?|true|false|null)\b/g, (m, s, colon, v) =>
          s ? `<span style="color:${colon ? t.synKey : t.synStr}">${s}</span>${colon || ''}` : `<span style="color:${t.synNum}">${v}</span>`)
    : null;
  const st = { fontFamily:MONO, fontSize:11.5, lineHeight:1.6, color:t.textPrimary, background:t.codeBg, borderRadius:6, padding:'10px 12px', whiteSpace: format === 'Text' ? 'pre-wrap' : 'pre', wordBreak:'break-all', overflowX:'auto', maxHeight:420, overflowY:'auto', border:`1px solid ${t.borderLight}` };
  return html ? <pre style={st} dangerouslySetInnerHTML={{ __html: html }}/> : <pre style={st}>{shown}</pre>;
}
function BodySection({ t, title, body, contentType }) {

  const [format, setFormat] = useState(binary ? 'Hex' : isJson ? 'JSON' : 'Text');

        {body && <span style={{ fontSize:10.5, color:t.textTertiary }}>{bytes(text.length)}{contentType ? ' · ' + contentType.split(';')[0] : ''}</span>}
        <div style={{ flex:1 }}/>
        {body && <Segmented small t={t} options={['Text','JSON','Hex']} value={format} onChange={setFormat}/>}
        {body && <Btn t={t} icon="copy" title="Copy"/>}

      {body ? <Code t={t} text={text} format={format}/> : <div style={{ fontSize:11.5, color:t.textTertiary, padding:'2px 0' }}>No body</div>}
    </div>
  );
}

      <div style={{ padding:'12px 18px 10px', borderBottom:`1px solid ${t.borderLight}` }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <Status x={x} t={t} big/>
          <span style={{ fontSize:12, fontWeight:700, fontFamily:MONO, color:t.textPrimary }}>{x.method}</span>
          <span style={{ fontSize:12, fontFamily:MONO, color:t.textPrimary, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', userSelect:'text' }}>{x.url}</span>
        </div>
        <div style={{ display:'flex', gap:6, marginTop:6, fontSize:11, color:t.textSecondary, alignItems:'center' }}>
          <span>{dur(x.duration_ms)}</span><span style={{ color:t.textTertiary }}>·</span>
          <span>{bytes(resSize)} ↓</span><span style={{ color:t.textTertiary }}>·</span>
          <Ic n={d.icon} sz={11} c={t.textSecondary}/><span>{d.name}</span><span style={{ color:t.textTertiary }}>·</span>
          <span>{clock(x.started_at)}</span><span style={{ color:t.textTertiary }}>·</span>
          <span>{x.capture_layer === 'platform' ? 'URLSession' : 'Ktor'}</span>
          
        </div>
      </div>
      <div style={{ flex:1, overflowY:'auto', padding:'14px 18px' }}>
        {tab === 'Body' && <>
          <BodySection t={t} title="Request" body={x.request.body} contentType={ct(x.request.headers || [])}/>
          <BodySection t={t} title="Response" body={x.response?.body} contentType={ct(resHeaders)}/>
        </>}
        {tab === 'Headers' && <>
          <H t={t}>Request · {(x.request.headers||[]).length}</H>
          <KV t={t} rows={(x.request.headers||[]).map(h => [h.name, h.value])}/>
          <div style={{ height:16 }}/>
          <H t={t}>Response · {resHeaders.length}</H>
          <KV t={t} rows={resHeaders.map(h => [h.name, h.value])}/>
        </>}
        {tab === 'Summary' && <>
          <H t={t}>Request</H>
          <KV t={t} rows={[['Host', x.host], ['Path', x.path], ['Query', x.query || '—'], ['Method', x.method], ['Scheme', x.scheme]]}/>
          <div style={{ height:16 }}/>
          <H t={t}>Response</H>
          <KV t={t} rows={[['Status', x.failed ? 'failed — ' + x.error : x.status_code ?? 'pending'], ['Duration', dur(x.duration_ms)], ['Body', bytes(resSize)], ['Content-Type', ct(resHeaders) || '—']]}/>
          <div style={{ height:16 }}/>
          <H t={t}>Device</H>
          <KV t={t} rows={[['Device', `${d.name} (${d.kind})`], ['OS', d.os], ['App', d.app], ['SDK', `${d.sdk} · ${x.capture_layer}`]]}/>
        </>}
        {tab === 'Timing' && <>
          <H t={t}>Timing</H>
          <div style={{ display:'flex', alignItems:'center', gap:10, fontSize:11.5, color:t.textSecondary }}>
            <span style={{ width:80 }}>Total</span>
            <div style={{ flex:1, height:8, borderRadius:4, background:t.chip, overflow:'hidden' }}>
              <div style={{ width: Math.min(100, (x.duration_ms||0)/50) + '%', height:'100%', background:t.accent, borderRadius:4 }}/>
            </div>
            <span style={{ width:60, textAlign:'right', fontVariantNumeric:'tabular-nums', color:t.textPrimary }}>{dur(x.duration_ms)}</span>
          </div>
          <div style={{ fontSize:11, color:t.textTertiary, marginTop:10 }}>DNS, connect, TLS and first byte when the SDK reports them.</div>
        </>}
        {tab === 'cURL' && <>
          <div style={{ display:'flex', alignItems:'center', marginBottom:6 }}><H t={t}>cURL</H><div style={{ flex:1 }}/><Btn t={t} icon="copy" label="Copy"/></div>
          <Code t={t} text={curlOf(x)} format="Text"/>
        </>}
      </div>
    </div>
  );
}

// ─── STATUS BAR ─────────────────────────────────────────────────────────────
function StatusBar({ t, recording, total }) {
  const Sep = () => <span style={{ color:t.textTertiary }}>·</span>;
  const Dot = ({ c }) => <div style={{ width:6, height:6, borderRadius:'50%', background:c }}/>;
  return (
    <div style={{ height:24, background:t.statusBarBg, borderTop:`1px solid ${t.border}`, display:'flex', alignItems:'center', padding:'0 12px', gap:10, fontSize:10.5, color:t.textSecondary, flexShrink:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:5 }}><Dot c={t.green}/><span>Listening :47474</span></div><Sep/>
      <span>2 devices connected</span><Sep/>
      {recording ? <div style={{ display:'flex', alignItems:'center', gap:5 }}><Dot c={t.red}/><span>Recording · {total} requests</span></div> : <span>Not recording</span>}<Sep/>
      <div style={{ display:'flex', alignItems:'center', gap:5 }}><Ic n="bolt" sz={10} c={t.textSecondary}/><span>MCP 127.0.0.1:47475</span></div><Sep/>
      <span style={{ color:t.textTertiary }}>Proxy off</span>
      <div style={{ flex:1 }}/>
      <span style={{ color:t.textTertiary }}>0 dropped</span>
    </div>
  );
}

// ─── COMMAND PALETTE ────────────────────────────────────────────────────────
function Palette({ t, onClose, rows, onPick, recording, setRecording }) {
  const [q, setQ] = useState('');
  const [hi, setHi] = useState(0);
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);
  const groups = useMemo(() => {
    const ql = q.toLowerCase();
    const has = s => !ql || s.toLowerCase().includes(ql);
    const seen = new Set();
    const reqs = rows.filter(x => has(x.method + ' ' + x.url)).filter(x => { const k = x.method + x.path; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5)
      .map(x => ({ label:x.path, sub:`${x.method} · ${x.host}`, icon:'globe', run:() => onPick(x.id) }));
    const actions = [
      { label: recording ? 'Stop recording' : 'Record', icon:'rec', kbd:'⌘R', run:() => setRecording(!recording) },
      { label:'Save marked requests', icon:'save', kbd:'⌘S' },
      { label:'Save marked as issue…', icon:'bug', kbd:'⌘I' },
      { label:'Mock this request…', icon:'mask', kbd:'⌘M' },
      { label:'Replay this request', icon:'replay', kbd:'⌘↵' },
      { label:'Copy as cURL', icon:'copy', kbd:'⌘⇧C' },
      { label:'Export HAR…', icon:'export', kbd:'⌘E' },
      { label:'Clear live list', icon:'trash', kbd:'⌘⌫' },
    ].filter(a => has(a.label));
    const open = [
      { label:'Issues', icon:'bug' }, { label:'Benchmarks', icon:'chart' }, { label:'Mock rules', icon:'mask' },
      { label:'Breakpoints', icon:'pause' }, { label:'Settings', icon:'gear', kbd:'⌘,' },
    ].filter(a => has(a.label));
    const devs = Object.values(DEVICES).filter(d => has(d.name + ' ' + d.os)).map(d => ({ label:`Show ${d.name}`, sub:`${d.app} · ${d.os}`, icon:d.icon }));
    return [['Requests', reqs], ['Actions', actions], ['Open', open], ['Devices', devs]].filter(([, i]) => i.length);
  }, [q, rows, recording]);
  const flat = groups.flatMap(([, i]) => i);
  useEffect(() => setHi(0), [q]);
  useEffect(() => {
    const h = e => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowDown') { e.preventDefault(); setHi(v => Math.min(flat.length - 1, v + 1)); }
      if (e.key === 'ArrowUp') { e.preventDefault(); setHi(v => Math.max(0, v - 1)); }
      if (e.key === 'Enter') { flat[hi]?.run?.(); onClose(); }
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [flat, hi]);
  let idx = 0;
  return (
    <div onClick={onClose} style={{ position:'absolute', inset:0, background:t.overlayBg, display:'flex', justifyContent:'center', alignItems:'flex-start', paddingTop:90, zIndex:100, backdropFilter:'blur(6px)' }}>
      <div onClick={e => e.stopPropagation()} style={{ width:560, borderRadius:12, background:t.paletteBg, boxShadow:t.shadow, border:`1px solid ${t.border}`, overflow:'hidden' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'11px 14px', borderBottom:`1px solid ${t.borderLight}` }}>
          <Ic n="search" sz={14} c={t.textTertiary}/>
          <input ref={ref} value={q} onChange={e => setQ(e.target.value)} placeholder="Search requests, actions, screens…"
            style={{ flex:1, border:'none', outline:'none', background:'transparent', fontSize:14, color:t.textPrimary }}/>
          <Kbd k="esc" t={t}/>
        </div>
        <div style={{ maxHeight:380, overflowY:'auto', padding:'4px 0 6px' }}>
          {groups.map(([g, items]) => (
            <div key={g}>
              <div style={{ fontSize:10, fontWeight:600, color:t.textTertiary, textTransform:'uppercase', letterSpacing:'0.08em', padding:'8px 14px 3px' }}>{g}</div>
              {items.map((it, i) => { const my = idx++; const on = my === hi; return (
                <div key={i} onMouseEnter={() => setHi(my)} onClick={() => { it.run?.(); onClose(); }}
                  style={{ display:'flex', alignItems:'center', gap:10, padding:'5px 14px', cursor:'pointer', background: on ? t.paletteActive : 'transparent' }}>
                  <div style={{ width:24, height:24, borderRadius:6, background:t.chip, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><Ic n={it.icon} sz={12} c={t.textSecondary}/></div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:12.5, color:t.textPrimary, fontWeight: on ? 500 : 400, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{it.label}</div>
                    {it.sub && <div style={{ fontSize:10.5, color:t.textTertiary }}>{it.sub}</div>}
                  </div>
                  {it.kbd && <Kbd k={it.kbd} t={t}/>}
                </div>
              ); })}
            </div>
          ))}
          {flat.length === 0 && <div style={{ padding:20, textAlign:'center', fontSize:12, color:t.textTertiary }}>Nothing matches “{q}”</div>}
        </div>
        <div style={{ borderTop:`1px solid ${t.borderLight}`, padding:'7px 14px', display:'flex', gap:14, fontSize:11, color:t.textTertiary }}>
          <span><Kbd k="↵" t={t}/> run</span><span><Kbd k="↑↓" t={t}/> move</span><span><Kbd k="⌘K" t={t}/> close</span>
        </div>
      </div>
    </div>
  );
}

// ─── ROOT ───────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
function App() {
  const [dark, setDark] = useState(params.get('dark') === '1');
  const [palette, setPalette] = useState(params.get('palette') === '1');
  const [sidebar, setSidebar] = useState(params.get('sidebar') !== '0');
  const [recording, setRecording] = useState(true);
  const [device, setDevice] = useState(null);
  const [run, setRun] = useState('rec');
  const [hostsOff, setHostsOff] = useState(new Set());
  const [query, setQuery] = useState('');
  const [statusF, setStatusF] = useState('All');
  const [sel, setSel] = useState(6);
  const [tab, setTab] = useState(params.get('tab') || 'Body');
  const [marked, setMarked] = useState(new Set());
  const searchRef = useRef(null);
  const t = dark ? D : L;

  useEffect(() => {
    const h = e => {
      const m = e.metaKey || e.ctrlKey;
      if (m && e.key === 'k') { e.preventDefault(); setPalette(v => !v); }
      if (m && e.key === 'f') { e.preventDefault(); searchRef.current?.focus(); }
      if (m && e.key === 'b') { e.preventDefault(); setSidebar(v => !v); }
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, []);

  const counts = useMemo(() => {
    const byDevice = {}; const hosts = {};
    ALL.forEach(x => { byDevice[x.session_id] = (byDevice[x.session_id] || 0) + 1; hosts[x.host] = (hosts[x.host] || 0) + 1; });
    return { total: ALL.length, byDevice, hosts: Object.entries(hosts).sort((a, b) => b[1] - a[1]) };
  }, []);
  const rows = ALL.filter(x => (device == null || x.session_id === device) && !hostsOff.has(x.host) && matchesStatus(x, statusF) && (!query || x.url.toLowerCase().includes(query.toLowerCase())));
  const toggle = (set, setter) => v => { const n = new Set(set); n.has(v) ? n.delete(v) : n.add(v); setter(n); };
  const current = ALL.find(x => x.id === sel);

  return (
    <div style={{ width:'100vw', height:'100vh', display:'flex', flexDirection:'column', alignItems:'center', background:t.windowBg, padding:'16px 20px 14px' }}>
      <div style={{ display:'flex', gap:4, width:'100%', maxWidth:1360, marginBottom:8, fontSize:12 }}>
        {[['Window', () => { setPalette(false); setSidebar(true); }], ['⌘K Palette', () => setPalette(true)], ['Sidebar hidden (⌘B)', () => setSidebar(v => !v)]].map(([l, f]) => (
          <button key={l} onClick={f} style={{ padding:'5px 12px', borderRadius:7, border:'none', background: dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)', color: dark ? '#CCC' : '#444', fontSize:12, cursor:'pointer' }}>{l}</button>
        ))}
        <div style={{ flex:1 }}/>
        <button onClick={() => setDark(!dark)} style={{ padding:'5px 12px', borderRadius:7, border:'none', background: dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)', color: dark ? '#CCC' : '#444', fontSize:12, cursor:'pointer' }}>{dark ? '☀ Light' : '☾ Dark'}</button>
      </div>
      <div style={{ flex:1, width:'100%', maxWidth:1360, minHeight:0, borderRadius:12, overflow:'hidden', boxShadow:t.windowShadow, border:`1px solid ${dark ? '#555' : '#ADADAF'}`, display:'flex', flexDirection:'column', position:'relative' }}>
        <div style={{ height:40, background:t.titleBar, borderBottom:`1px solid ${t.border}`, display:'flex', alignItems:'center', padding:'0 12px', gap:12, flexShrink:0 }}>
          <TrafficLights/>
          <Btn t={t} icon="sidebar" title="Sidebar ⌘B" onClick={() => setSidebar(!sidebar)} active={sidebar}/>
          <div style={{ flex:1, textAlign:'center', fontSize:13, color:t.titleBarText, fontWeight:500 }}>App Monitor <span style={{ color:t.textTertiary, fontWeight:400 }}>— Recording</span></div>
          <Btn t={t} icon="rec" label={recording ? 'Stop' : 'Record'} danger active={recording} onClick={() => setRecording(!recording)}/>
          <Btn t={t} icon="trash" title="Clear ⌘⌫"/>
          <div onClick={() => setPalette(true)} style={{ display:'flex', alignItems:'center', gap:6, padding:'3px 8px', borderRadius:6, fontSize:11, color:t.textTertiary, border:`1px solid ${t.border}`, cursor:'pointer', background: palette ? t.accentSoft : 'transparent' }}>
            <Ic n="search" sz={11} c={t.textTertiary}/><span>Actions</span><Kbd k="⌘K" t={t}/>
          </div>
        </div>
        <div style={{ flex:1, display:'flex', minHeight:0 }}>
          {sidebar && <Sidebar t={t} device={device} setDevice={setDevice} run={run} setRun={setRun} hostsOff={hostsOff} toggleHost={toggle(hostsOff, setHostsOff)} counts={counts}/>}
          <RequestList t={t} rows={rows} sel={sel} setSel={setSel} query={query} setQuery={setQuery} statusF={statusF} setStatusF={setStatusF} marked={marked} toggleMark={toggle(marked, setMarked)} searchRef={searchRef}/>
          <Detail t={t} x={current} tab={tab} setTab={setTab}/>
        </div>
        <StatusBar t={t} recording={recording} total={ALL.length}/>
        {palette && <Palette t={t} onClose={() => setPalette(false)} rows={ALL} onPick={setSel} recording={recording} setRecording={setRecording}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
