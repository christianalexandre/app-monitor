// Channel "core": connection handshake. The device sends Hello first; the
// desktop answers HelloAck before any other channel is used (ADR-0002).
syntax = "proto3";

package appmonitor.v1;

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_ANDROID = 1;
  PLATFORM_IOS = 2;
  PLATFORM_JVM = 3;
}

message Hello {
  uint32 protocol_version = 1;
  Platform platform = 2;
  // Stable per install, chosen by the SDK.
  string device_id = 3;
  string device_name = 4;
  string os_version = 5;
  // Bundle id (iOS) or application id (Android).
  string app_id = 6;
  string app_version = 7;
  string sdk_version = 8;
  // Channels the device can send or receive.
  repeated string channels = 9;
  // Which SDK opened the session: "kotlin" (sdk/core) or "swift" (sdk/ios).
  string sdk_name = 10;
  // AppMonitorOptions.appName; empty when the app set none (ADR-0165).
  string app_name = 11;
}

message HelloAck {
  uint32 protocol_version = 1;
  // Identifies this connection on the desktop.
  string session_id = 2;
  // Subset of Hello.channels the desktop accepted.
  repeated string channels = 3;
}

// Sent by the device after HelloAck before any other envelope, then before the
// next envelope whenever a count grew (ADR-0166). Counts run from the SDK's
// start, across its sessions.
message DeliveryReport {
  // Oldest envelopes dropped to make room in the device's buffer.
  int64 evicted = 1;
  // Envelopes larger than a frame, dropped before the buffer.
  int64 oversized = 2;
  // HelloAck.session_id of this SDK start's previous session; empty for the first.
  string previous_session_id = 3;
  // Frames the device wrote after Hello on that session.
  int64 previous_session_written = 4;
}
