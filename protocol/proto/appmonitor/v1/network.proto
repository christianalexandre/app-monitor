// Channel "network": HTTP and WebSocket traffic seen by the app. Event times
// come from Envelope.timestamp_ms.
syntax = "proto3";

package appmonitor.v1;

message Header {
  string name = 1;
  string value = 2;
}

// Which capture layer produced an exchange (ADR-0004, ADR-0038).
enum CaptureLayer {
  CAPTURE_LAYER_UNSPECIFIED = 0;
  // The platform HTTP stack, full content: URLSession.
  CAPTURE_LAYER_PLATFORM = 1;
  // An interceptor in a library the app owns: OkHttp, Ktor, grpc-swift.
  CAPTURE_LAYER_ADAPTER = 2;
  // Connection metadata only, no content.
  CAPTURE_LAYER_CONNECTION = 3;
  // The desktop proxy.
  CAPTURE_LAYER_PROXY = 4;
}

message RequestStarted {
  // Unique per device; links the events of one request.
  string request_id = 1;
  string method = 2;
  string url = 3;
  repeated Header headers = 4;
  // At most the sender's body limit; see body_truncated (ADR-0020).
  bytes body = 5;
  // body holds less than the original, or nothing when it could not be read.
  bool body_truncated = 6;
  // Original body size in bytes; absent when unknown.
  optional int64 body_size = 7;
  // Holds for every event of this request_id, WebSocket frames included.
  CaptureLayer capture_layer = 8;
  // The MockRule.id that answered the request on the device; absent when the
  // network did (ADR-0110 E.1).
  optional int64 mock_rule_id = 9;
}

message ResponseReceived {
  string request_id = 1;
  int32 status_code = 2;
  repeated Header headers = 3;
  // Same rules as RequestStarted.body (ADR-0020).
  bytes body = 4;
  bool body_truncated = 5;
  optional int64 body_size = 6;
  // CAPTURE_LAYER_CONNECTION only: bytes the app wrote, body_size the bytes it
  // read; status_code 0 and no body (ADR-0103).
  optional int64 sent_size = 7;
}

message RequestFailed {
  string request_id = 1;
  // Platform error description, e.g. "java.net.SocketTimeoutException: timeout".
  string error = 2;
}

message WebSocketFrame {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_SENT = 1;
    DIRECTION_RECEIVED = 2;
  }

  enum Opcode {
    OPCODE_UNSPECIFIED = 0;
    OPCODE_TEXT = 1;
    OPCODE_BINARY = 2;
    OPCODE_PING = 3;
    OPCODE_PONG = 4;
    OPCODE_CLOSE = 5;
  }

  // request_id of the RequestStarted that opened the WebSocket.
  string request_id = 1;
  Direction direction = 2;
  Opcode opcode = 3;
  // At most the sender's body limit; same rules as RequestStarted.body (ADR-0028).
  bytes payload = 4;
  bool payload_truncated = 5;
  optional int64 payload_size = 6;
}
