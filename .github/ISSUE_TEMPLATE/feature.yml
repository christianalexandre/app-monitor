name: Feature
description: A new capability for an SDK or the desktop app
title: "feat: "
labels: [feat]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't the developer do or see today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen. Public API sketch if it touches an SDK.
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Desktop
        - label: Android
        - label: iOS
        - label: KMP
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The command or observable result that proves it is done.
    validations:
      required: true
