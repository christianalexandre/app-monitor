name: Bug
description: Something captured wrong, missing or broken
title: "fix: "
labels: [fix]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What you saw vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SDK version, desktop version, OS, device/emulator.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, HAR export.
