name: CI

on:
  pull_request:
    branches: [dev]
  # ADR-0012: the dev run seeds the Gradle cache that PR runs read.
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # ADR-0012: dev push runs must finish to seed the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - run: make check
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
