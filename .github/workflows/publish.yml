name: Publish

# ADR-0217, ADR-0232: an X.Y.Z tag on main publishes the SDKs, a desktop-X.Y.Z tag the desktop;
# a PR that changes the publication runs both dry.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'desktop-[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/publish.yml
      - scripts/publish_dry_run.sh
      - scripts/central_upload.sh
      - scripts/version_check.sh
      - build-logic/src/main/kotlin/appmonitor.maven-central.gradle.kts
      - build-logic/src/main/kotlin/appmonitor.publish.gradle.kts
      - desktop/app/build.gradle.kts
      - scripts/desktop_packages.sh
      - scripts/tap_manifests.sh
      - gradle.properties
      - gradle-plugin/build.gradle.kts
      - protocol/build.gradle.kts
      - 'sdk/*/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE: ${{ github.ref_type == 'tag' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        run: |
          if [[ "$RELEASE" == true ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "::error::tag $TAG is not on main"; exit 1; }
            scripts/version_check.sh --release "$TAG"
          else
            scripts/version_check.sh
          fi

  central:
    needs: version
    if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'desktop-')
    runs-on: macos-latest # ADR-0058: the iOS klibs
    timeout-minutes: 60
    env:
      RELEASE: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Signed repository, checked
        env:
          APPMONITOR_SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.APPMONITOR_SIGNING_KEY || '' }}
          APPMONITOR_SIGNING_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPMONITOR_SIGNING_PASSWORD || '' }}
        run: make publish-dry-run
      - name: Upload to Maven Central
        if: env.RELEASE == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: scripts/central_upload.sh build/maven-dry-run
      - name: Bundle only
        if: env.RELEASE != 'true'
        run: scripts/central_upload.sh build/maven-dry-run --bundle-only
      - name: Central bundle
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: build/central-bundle.zip
          if-no-files-found: error
          retention-days: 7

  # ADR-0227: each OS builds its own packages; jpackage does not cross-build.
  desktop:
    needs: version
    if: github.ref_type != 'tag' || startsWith(github.ref_name, 'desktop-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: rpmbuild
        if: matrix.os == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - name: Packages
        run: scripts/desktop_packages.sh build ${{ matrix.os }} build/desktop-packages
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: build/desktop-packages/*
          if-no-files-found: error
          retention-days: 7

  # The only write token, and only on a tag: a PR's dry run runs the PR's own scripts.
  # A tag runs central or desktop, never both: the other one is skipped.
  # A refused tag skips central and desktop; without version's success here it would still get a release.
  release:
    needs: [version, central, desktop]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.version.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        if: startsWith(github.ref_name, 'desktop-')
        with:
          pattern: desktop-*
          path: build/desktop-packages
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(build/desktop-packages/*)
          title="$TAG"
          [[ "$TAG" != desktop-* ]] || title="Desktop ${TAG#desktop-}"
          notes="$(awk -v v="## $title" '($0 == v || index($0, v " ") == 1) {f = 1; next} /^## / && f {exit} f' CHANGELOG.md 2>/dev/null || true)"
          if [[ -n "$notes" ]]; then
            gh release create "$TAG" --verify-tag --title "$title" --notes "$notes" "${packages[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$title" --generate-notes "${packages[@]}"
          fi

  # ADR-0229: the Homebrew cask and the Scoop manifest, pushed to homebrew-tap once the release has its packages.
  tap:
    needs: [desktop, release]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && (github.ref_type != 'tag' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE: ${{ github.ref_type == 'tag' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: build/desktop-packages
          merge-multiple: true
      - name: Manifests
        run: |
          version="${TAG#desktop-}"
          [[ "$RELEASE" == true ]] || { version="$(sed -n 's/^DESKTOP_VERSION_NAME=//p' gradle.properties)"; version="${version%%-*}"; }
          scripts/tap_manifests.sh "$version" build/desktop-packages build/tap
      - name: Push to homebrew-tap
        if: env.RELEASE == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/christianalexandre/homebrew-tap.git" build/tap-repo
          cp -R build/tap/. build/tap-repo/
          cd build/tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "app-monitor $TAG"
          git push origin HEAD
      - name: Manifests, dry
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tap
          path: build/tap
          if-no-files-found: error
          retention-days: 7
