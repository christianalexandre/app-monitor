name: Release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      head:
        description: Head branch checked as if a PR to main came from it
        default: dev

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.head_ref || github.ref }}-${{ inputs.head }}
  cancel-in-progress: true

jobs:
  branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Head branch may target main
        env:
          HEAD_REF: ${{ github.head_ref || inputs.head }}
        run: scripts/branch_check.sh "$HEAD_REF" main

  desktop:
    needs: branch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Curl for the proxy tests
        if: runner.os == 'Windows'
        # Windows' own curl (Schannel) has no HTTP/2 and fails the test CA's revocation check; Git for Windows' has both.
        run: |
          echo 'APPMONITOR_CURL=C:\Program Files\Git\mingw64\bin\curl.exe' >> "$GITHUB_ENV"
          echo 'CURL_SSL_BACKEND=openssl' >> "$GITHUB_ENV"
          '/c/Program Files/Git/mingw64/bin/curl.exe' --version
      - name: Desktop app tests
        run: ./gradlew :desktop:app:test
      - name: Desktop proxy tests
        run: ./gradlew :desktop:proxy:test
      - name: Desktop server tests
        env:
          APPMONITOR_NO_LOCAL_NETWORK: ${{ runner.os == 'macOS' && '1' || '' }} # DEBT-0046
        run: ./gradlew :desktop:server:test
      - name: Protocol JVM tests
        run: ./gradlew :protocol:jvmTest
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 7

  package:
    needs: branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: dmg
            task: packageDmg
          - os: windows-latest
            format: msi
            task: packageMsi
          - os: ubuntu-latest
            format: deb
            task: packageDeb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Unsigned ${{ matrix.format }} package
        run: ./gradlew :desktop:app:${{ matrix.task }}
      - name: Package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.format }}
          path: desktop/app/build/compose/binaries/main/${{ matrix.format }}/
          if-no-files-found: error
          retention-days: 7 # ADR-0055

  contract:
    needs: branch
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -m1 iPhone
      - name: Swift SDK gates
        run: make swift
      - name: Swift SDK tests on the simulator
        run: make swift-sim
      - name: Protocol tests, all targets
        run: ./gradlew :protocol:allTests
      - name: Logs and reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-logs
          path: |
            build/ios-simulator.log
            protocol/build/reports/tests/
          retention-days: 7

  samples:
    needs: branch
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun simctl list devices available | grep -m1 iPhone
      - name: Sample apps, debug and release
        run: make samples
      - name: Logs and reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: samples-logs
          path: |
            build/ios-sample.log
            build/kmp-sample.log
            samples/android/build/reports/
          retention-days: 7

  e2e-android:
    needs: branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the sample and the server
        run: ./gradlew :samples:android:assembleDebug :desktop:server:installDist :tools:e2e-target:installDist
      - name: Android end to end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: make e2e-android
      - name: Server log and logcat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-logs
          path: build/e2e-android/
          retention-days: 7

  e2e-ios:
    needs: branch
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun simctl list devices available | grep -m1 iPhone
      - name: iOS end to end
        run: make e2e-ios
      - name: Server, simulator and sample build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios-logs
          path: build/e2e-ios/
          retention-days: 7

  e2e-kmp-android:
    needs: branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the KMP sample and the server
        run: ./gradlew :samples:kmp:androidApp:assembleDebug :desktop:server:installDist :tools:e2e-target:installDist
      - name: KMP Android end to end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: make e2e-kmp-android
      - name: Server log and logcat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-kmp-android-logs
          path: build/e2e-kmp-android/
          retention-days: 7

  e2e-kmp-ios:
    needs: branch
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun simctl list devices available | grep -m1 iPhone
      - name: KMP iOS end to end
        run: make e2e-kmp-ios
      - name: Server, simulator and sample build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-kmp-ios-logs
          path: build/e2e-kmp-ios/
          retention-days: 7

  publish:
    needs: branch
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # ADR-0012
      - name: SDK publication dry-run
        run: make publish-dry-run
      - name: Maven dry-run repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-dry-run
          path: build/maven-dry-run/
          if-no-files-found: error
          retention-days: 7
