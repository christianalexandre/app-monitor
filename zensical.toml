# The docs site (ADR-0234): its pages are written by scripts/site_src.py into build/site-src, never edited there.
[project]
site_name = "App Monitor"
site_description = "See every request your mobile app makes, live, on your desktop, without a proxy."
site_url = "https://christianalexandre.github.io/app-monitor/"
repo_url = "https://github.com/christianalexandre/app-monitor"
repo_name = "christianalexandre/app-monitor"
docs_dir = "build/site-src"
site_dir = "build/site"
copyright = "MIT license"
nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    "guide/index.md",
    { "Android" = "guide/android.md" },
    { "iOS" = "guide/ios.md" },
    { "Kotlin Multiplatform" = "guide/kmp.md" },
    { "The desktop app" = "guide/desktop.md" },
    { "Ask your AI agent (MCP)" = "guide/mcp.md" },
    { "Compatibility" = "guide/compatibility.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.superfences = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
