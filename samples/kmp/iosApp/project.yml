name: KmpSample
options:
  bundleIdPrefix: dev.appmonitor
  deploymentTarget:
    iOS: "15.0"
packages:
  AppMonitor:
    path: ../../../sdk/ios
targets:
  KmpSample:
    type: application
    platform: iOS
    sources: [KmpSample]
    dependencies:
      - package: AppMonitor
    info:
      path: KmpSample/Info.plist
      properties:
        CFBundleDisplayName: AppMonitor KMP Sample
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.appmonitor.kmpsample
      SWIFT_VERSION: "6.0"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
      OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Kotlin framework
        script: 'cd "$SRCROOT/../../.." && ./gradlew :samples:kmp:shared:embedAndSignAppleFrameworkForXcode'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: AppMonitor local network keys
        script: '"$SRCROOT/../../../sdk/ios/scripts/add_local_network_keys.sh"'
        inputFiles:
          - $(SRCROOT)/../../../sdk/ios/scripts/add_local_network_keys.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(DERIVED_FILE_DIR)/appmonitor-local-network-keys.stamp
